name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Test
        run: make test
      - name: Build CCU package
        run: make package
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ccu-modbus-package
          path: build/ccu-modbus-*.tar.gz
