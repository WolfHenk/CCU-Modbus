name: build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'releases/**'
      - 'README.md'
  pull_request:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Test
        run: make test

      - name: Build CCU package
        run: make package

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccu-modbus-package
          path: build/ccu-modbus-*.tar.gz

      - name: Store installable package in repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          VERSION="$(cat VERSION)"

          # A newer main commit may arrive while this run is building. In that
          # case this run is obsolete and must not try to publish an older
          # "latest" package on top of the newer commit.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Newer main commit detected; skip publishing package from obsolete run."
            exit 0
          fi

          mkdir -p releases
          cp "build/ccu-modbus-${VERSION}.tar.gz" "releases/ccu-modbus-latest.tar.gz"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "releases/ccu-modbus-latest.tar.gz"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add installable package ${VERSION} [skip ci]"
          git push

          PACKAGE_COMMIT="$(git rev-parse HEAD)"
          PACKAGE_COMMIT="$PACKAGE_COMMIT" python3 -c 'from pathlib import Path; import os,re; p=Path("README.md"); s=p.read_text(); sha=os.environ["PACKAGE_COMMIT"]; url=f"https://raw.githubusercontent.com/WolfHenk/CCU-Modbus/{sha}/releases/ccu-modbus-latest.tar.gz"; s=re.sub(r"https://raw\.githubusercontent\.com/WolfHenk/CCU-Modbus/[0-9a-f]{40}/releases/ccu-modbus-latest\.tar\.gz",url,s); p.write_text(s)'
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Pin download link for ${VERSION} [skip ci]"
            git push
          fi
