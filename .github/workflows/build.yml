name: build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'releases/**'
  pull_request:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Test
        run: make test

      - name: Build CCU package
        run: make package

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccu-modbus-package
          path: build/ccu-modbus-*.tar.gz

      - name: Store installable package in repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          VERSION="$(cat VERSION)"
          mkdir -p releases
          cp "build/ccu-modbus-${VERSION}.tar.gz" "releases/ccu-modbus-${VERSION}.tar.gz"
          cp "build/ccu-modbus-${VERSION}.tar.gz" "releases/ccu-modbus-latest.tar.gz"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "releases/ccu-modbus-${VERSION}.tar.gz" "releases/ccu-modbus-latest.tar.gz"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add installable package ${VERSION} [skip ci]"
          git push
